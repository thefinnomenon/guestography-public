name: Agent task
description: Create an agent-ready implementation task for the repository harness.
title: "[Agent Task] "
labels:
  - agent
body:
  - type: markdown
    attributes:
      value: |
        Use this template for work you want the agent harness to pick up automatically.
        The triage workflow may ask follow-up questions in the issue before implementation starts.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the task in one or two paragraphs.
      placeholder: Fix or improve...
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: In scope
      description: List the files, features, or outcomes that should change.
      placeholder: |
        - Update...
        - Add...
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: List explicit non-goals so the agent does not expand the task.
      placeholder: |
        - Do not migrate...
        - Do not redesign...
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true for this issue to be done.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Commands or manual checks the agent should run if possible.
      placeholder: |
        yarn lint
        npm --prefix functions run build
  - type: textarea
    id: extra_context
    attributes:
      label: Extra context
      description: Links, screenshots, docs, or historical context.
