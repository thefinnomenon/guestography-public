name: Sync Harness Labels

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-harness-labels.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - "docs/automation.md"
      - "README.md"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync_labels:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure harness labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const desired = [
              {
                name: "agent",
                color: "1f6feb",
                description: "Opt in to the agent issue harness",
              },
              {
                name: "ready-for-agent",
                color: "2da44e",
                description: "Triage approved this issue for implementation",
              },
              {
                name: "needs-context",
                color: "d29922",
                description: "Triage is waiting for more context in the issue thread",
              },
              {
                name: "needs-plan",
                color: "bf8700",
                description: "Issue should be broken down or planned before coding",
              },
            ];

            for (const label of desired) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                });

                await github.rest.issues.updateLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  new_name: label.name,
                  color: label.color,
                  description: label.description,
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }

                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description,
                });
              }
            }
