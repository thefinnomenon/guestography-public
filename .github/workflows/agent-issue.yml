name: Agent Issue Worker

on:
  issues:
    types:
      - labeled
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to run the agent against
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  agent_issue:
    concurrency:
      group: agent-issue-${{ github.event.issue.number || inputs.issue_number || github.run_id }}
      cancel-in-progress: true
    if: >
      (github.event_name == 'issues' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'ready-for-agent') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
      AGENT_MODEL: ${{ vars.AGENT_MODEL }}
      AGENT_EFFORT: ${{ vars.AGENT_EFFORT }}
      AGENT_ALLOW_USERS: ${{ vars.AGENT_ALLOW_USERS }}
    steps:
      - name: Resolve issue payload for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            const payloadPath = `${process.env.RUNNER_TEMP}/workflow-dispatch-issue.json`;
            const fs = require("fs");
            fs.writeFileSync(payloadPath, JSON.stringify({ issue }, null, 2));
            core.exportVariable("GITHUB_EVENT_PATH", payloadPath);

      - name: Detect whether Functions dependencies are needed
        id: scope
        uses: actions/github-script@v7
        with:
          script: |
            const event = require(process.env.GITHUB_EVENT_PATH);
            const issue = event.issue || event;
            const text = `${issue.title || ""}\n${issue.body || ""}`.toLowerCase();
            const docsOnly =
              (text.includes("readme.md") || text.includes("docs/") || text.includes("agents.md")) &&
              !text.includes("pages/") &&
              !text.includes("components/") &&
              !text.includes("lib/") &&
              !text.includes("utils/") &&
              !text.includes("functions/");
            const needsFunctions =
              text.includes("functions/") ||
              text.includes("firebase function") ||
              text.includes("cloud function");
            core.setOutput("docs_only", docsOnly ? "true" : "false");
            core.setOutput("needs_functions", needsFunctions ? "true" : "false");

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install app dependencies
        if: steps.scope.outputs.docs_only != 'true'
        run: yarn install --frozen-lockfile

      - name: Install functions dependencies
        if: steps.scope.outputs.docs_only != 'true' && steps.scope.outputs.needs_functions == 'true'
        run: npm install --prefix functions --no-package-lock

      - name: Compute branch name
        id: branch
        shell: bash
        run: |
          ISSUE_TITLE="$(node -e "const e=require(process.env.GITHUB_EVENT_PATH); const issue=e.issue||e; const title=(issue&&issue.title)||'task'; console.log(title.replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-+|-+$/g,'').toLowerCase().slice(0,48) || 'task')")"
          echo "name=agent/issue-${ISSUE_NUMBER}-${ISSUE_TITLE}" >> "$GITHUB_OUTPUT"

      - name: Prepare agent prompt
        run: node scripts/automation/prepare-agent-prompt.cjs "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/agent-prompt.md"

      - name: Run agent
        id: run_agent
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/agent-prompt.md
          sandbox: workspace-write
          model: ${{ env.AGENT_MODEL }}
          effort: ${{ env.AGENT_EFFORT }}
          allow-users: ${{ env.AGENT_ALLOW_USERS }}

      - name: Normalize agent summary
        id: summary
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          RAW_SUMMARY: ${{ steps.run_agent.outputs.final-message }}
        with:
          script: |
            const raw = (process.env.RAW_SUMMARY || "").trim();
            const issueNumber = process.env.ISSUE_NUMBER;
            let summary = raw || "The agent completed without emitting a final summary.";
            summary = summary.replace(/#undefined/g, `#${issueNumber}`);
            summary = summary.replace(/\bundefined issue\b/gi, `issue #${issueNumber}`);
            summary = summary.replace(/\s+/g, " ").trim();
            core.setOutput("text", summary);

      - name: Create or update pull request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: ${{ steps.branch.outputs.name }}
          commit-message: "chore: address issue #${{ env.ISSUE_NUMBER }}"
          title: "Agent: resolve issue #${{ env.ISSUE_NUMBER }}"
          body: |
            Closes #${{ env.ISSUE_NUMBER }}

            This pull request was prepared by the repository agent harness.

            Issue context:
            - Issue: #${{ env.ISSUE_NUMBER }}

            Agent summary:
            ${{ steps.summary.outputs.text }}
          add-paths: |
            .
          delete-branch: true

      - name: Comment with PR link
        if: steps.cpr.outputs.pull-request-url != ''
        uses: actions/github-script@v7
        env:
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: `The agent opened or updated a pull request: ${process.env.PR_URL}`,
            });

      - name: Comment when no code changes were produced
        if: steps.cpr.outputs.pull-request-url == ''
        uses: actions/github-script@v7
        env:
          FINAL_MESSAGE: ${{ steps.summary.outputs.text }}
        with:
          script: |
            const summary = process.env.FINAL_MESSAGE || "The agent completed without producing a diff.";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: `The agent did not open a pull request.\n\n${summary}`,
            });
