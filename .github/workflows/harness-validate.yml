name: Validate Harness

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "docs/**"
      - ".github/**"
      - "scripts/ci/**"
      - "scripts/automation/**"
      - "package.json"
      - "yarn.lock"
  push:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - "docs/**"
      - ".github/**"
      - "scripts/ci/**"
      - "scripts/automation/**"
      - "package.json"
      - "yarn.lock"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate harness docs
        run: node scripts/ci/validate-harness-docs.cjs
