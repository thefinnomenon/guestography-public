name: Doc Gardener

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  doc_gardener:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AGENT_MODEL: ${{ vars.AGENT_MODEL }}
      AGENT_EFFORT: ${{ vars.AGENT_EFFORT }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run agent doc gardener
        id: run_agent
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: workspace-write
          model: ${{ env.AGENT_MODEL }}
          effort: ${{ env.AGENT_EFFORT }}
          prompt: |
            Audit the repository harness and docs for drift.

            Read AGENTS.md and the docs/ directory, then compare them against the current repository layout and workflows.

            Make only small, high-confidence documentation or harness-maintenance edits such as:
            - fixing stale paths
            - updating workflow descriptions
            - refreshing repo maps
            - tightening issue or PR templates

            Do not perform feature work. Do not change application behavior. Leave the repository ready for a commit.

      - name: Create or update PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: agent/doc-gardener
          commit-message: "docs: refresh harness documentation"
          title: "Agent: refresh harness documentation"
          body: |
            Scheduled documentation maintenance from the repository agent harness.

            Agent summary:
            ${{ steps.run_agent.outputs.final-message }}
          add-paths: |
            AGENTS.md
            docs/**
            .github/**
            scripts/ci/**
            scripts/automation/**
