name: Agent Issue Triage

on:
  issues:
    types:
      - opened
      - edited
      - reopened
      - labeled
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to triage
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Decide whether triage should run
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const eventName = context.eventName;
            const issue = context.payload.issue;
            const comment = context.payload.comment;
            const label = context.payload.label;

            if (eventName === "workflow_dispatch") {
              core.setOutput("should_run", "true");
              return;
            }

            if (!issue || issue.pull_request) {
              core.setOutput("should_run", "false");
              return;
            }

            const labels = (issue.labels || []).map((entry) => {
              return typeof entry === "string" ? entry : entry.name;
            });

            if (eventName === "issues") {
              const isAgentIssue = labels.includes("agent");
              const justAddedAgentLabel = context.payload.action === "labeled" && label?.name === "agent";
              core.setOutput("should_run", isAgentIssue || justAddedAgentLabel ? "true" : "false");
              return;
            }

            if (eventName === "issue_comment") {
              const isMaintainer = ["OWNER", "MEMBER", "COLLABORATOR"].includes(comment?.author_association || "");
              const isTrackedIssue = labels.includes("agent") || labels.includes("needs-context");
              core.setOutput("should_run", isMaintainer && isTrackedIssue ? "true" : "false");
              return;
            }

            core.setOutput("should_run", "false");

      - name: Resolve issue number
        if: steps.gate.outputs.should_run == 'true'
        id: issue_number
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === "workflow_dispatch") {
              core.setOutput("value", "${{ inputs.issue_number }}");
              return;
            }

            core.setOutput("value", String(context.payload.issue.number));

      - name: Fetch full issue context
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.issue_number.outputs.value }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const payloadPath = `${process.env.RUNNER_TEMP}/triage-issue-context.json`;
            const fs = require("fs");
            fs.writeFileSync(payloadPath, JSON.stringify({ issue, comments }, null, 2));
            core.exportVariable("TRIAGE_EVENT_PATH", payloadPath);

      - name: Analyze issue
        if: steps.gate.outputs.should_run == 'true'
        run: node scripts/automation/analyze-issue-context.cjs "$TRIAGE_EVENT_PATH" > "$RUNNER_TEMP/triage-result.json"

      - name: Apply labels and triage comment
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.issue_number.outputs.value }}
          TRIAGE_RESULT_PATH: ${{ runner.temp }}/triage-result.json
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- agent-triage -->";
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const result = JSON.parse(fs.readFileSync(process.env.TRIAGE_RESULT_PATH, "utf8"));
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const currentLabels = issue.labels.map((label) => label.name);
            const stateLabels = ["ready-for-agent", "needs-context", "needs-plan"];
            const nextLabels = currentLabels
              .filter((label) => !stateLabels.includes(label))
              .concat(result.status);

            await github.rest.issues.setLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: Array.from(new Set(nextLabels)),
            });

            let body = "";
            if (result.status === "ready-for-agent") {
              body = [
                marker,
                "Agent triage result: `ready-for-agent`",
                "",
                result.rationale,
                "",
                "The implementation workflow can proceed on this issue.",
              ].join("\n");
            } else if (result.status === "needs-plan") {
              body = [
                marker,
                "Agent triage result: `needs-plan`",
                "",
                result.rationale,
                "",
                "This issue should be split into smaller tasks or start with an execution plan in `docs/exec-plans/` before direct implementation.",
              ].join("\n");
            } else {
              const questions = result.questions.map((question) => `- ${question}`).join("\n");
              body = [
                marker,
                "Agent triage result: `needs-context`",
                "",
                result.rationale,
                "",
                "Please reply in this issue with:",
                questions,
                "",
                "When enough context is present, triage will relabel the issue automatically and the implementation workflow can continue.",
              ].join("\n");
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });

            const existing = comments.find((comment) => {
              return comment.user?.type === "Bot" && typeof comment.body === "string" && comment.body.includes(marker);
            });

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }
